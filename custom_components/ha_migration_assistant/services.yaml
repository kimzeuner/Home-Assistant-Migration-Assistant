rescan:
  name: Rescan migration references
  description: Rescan the Home Assistant configuration for migration references.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. If omitted, all migration entries are rescanned.
      required: false
      selector:
        text:

export_plan:
  name: Export migration plan
  description: Export the current migration plan as JSON into /config/ha_migration_assistant/.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. If omitted, all migration entries are exported.
      required: false
      selector:
        text:
    filename:
      name: Filename
      description: Optional export filename without path. The .json extension is added automatically.
      required: false
      selector:
        text:

generate_diff:
  name: Generate migration diff
  description: Generate a read-only unified-style diff preview into /config/ha_migration_assistant/.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. If omitted, all migration entries generate a diff.
      required: false
      selector:
        text:
    filename:
      name: Filename
      description: Optional export filename without path. The .diff extension is added automatically.
      required: false
      selector:
        text:
